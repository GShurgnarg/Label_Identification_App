<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label Validator</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; color: #333; }
        .file-group { border: 1px dashed #ccc; padding: 15px; margin: 15px 0; border-radius: 6px; background: #fafafa; }
        #preview { max-width: 100%; max-height: 250px; margin-top: 15px; display: none; border-radius: 8px; }
        .btn { display: inline-block; padding: 12px 24px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn:disabled { background: #cccccc; cursor: not-allowed; }
        #status { font-weight: bold; margin-top: 15px; }
        .error { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 4px; }
        .success { color: #155724; background: #d4edda; padding: 10px; border-radius: 4px; }
        #results { text-align: left; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; white-space: pre-wrap; font-family: monospace; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>Alcohol Label TTB Verifier</h2>
    
    <div class="file-group">
        <label style="display:block; margin-bottom:8px; font-weight:bold;">1. Upload Expected Label Data (.json or .txt):</label>
        <input type="file" id="expectedDataFile" accept=".json,.txt">
    </div>

    <div class="file-group">
        <label style="display:block; margin-bottom:8px; font-weight:bold;">2. Capture / Upload Photo:</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
        <img id="preview" alt="Captured label preview">
    </div>

    <button class="btn" id="verifyBtn" disabled>Run Verification Check</button>
    
    <div id="status"></div>
    <div id="results"></div>

    <script>
        const expectedDataFile = document.getElementById('expectedDataFile');
        const cameraInput = document.getElementById('cameraInput');
        const verifyBtn = document.getElementById('verifyBtn');
        const preview = document.getElementById('preview');
        const statusDiv = document.getElementById('status');
        const resultsDiv = document.getElementById('results');

        // Enable verification button only when both files are selected
        const toggleButton = () => {
            verifyBtn.disabled = !(expectedDataFile.files[0] && cameraInput.files[0]);
        };
        expectedDataFile.addEventListener('change', toggleButton);
        cameraInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                preview.src = URL.createObjectURL(e.target.files[0]);
                preview.style.display = 'inline-block';
            }
            toggleButton();
        });

        verifyBtn.addEventListener('click', async () => {
            statusDiv.className = '';
            statusDiv.innerText = 'Analyzing and verifying label text conformity...';
            resultsDiv.style.display = 'none';

            const formData = new FormData();
            formData.append('image', cameraInput.files[0]);
            formData.append('expected_data', expectedDataFile.files[0]);

            try {
                const response = await fetch('/api/verify-label', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Verification failed');

                if (data.mismatches_found === 0 && data.ttb_compliance.government_warning_compliant) {
                    statusDiv.className = 'success';
                    statusDiv.innerText = 'SUCCESS: Exact Match -> LABEL = compliant';
                } else {
                    statusDiv.className = 'error';
                    statusDiv.innerText = 'FAILED: Variations/ Noncompliance detected.';
                }

                resultsDiv.innerText = JSON.stringify(data, null, 2);
                resultsDiv.style.display = 'block';

            } catch (err) {
                statusDiv.className = 'error';
                statusDiv.innerText = 'ERROR: ' + err.message;
            }
        });
    </script>
</body>
</html>
